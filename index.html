<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>핏그라운드 실시간 트레드밀 통합 시스템</title>

  <!-- Firebase SDK 라이브러리 추가 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; /* 스크롤바 완전히 제거 */
    }
    body { 
      padding: 10px; 
      display: flex;
      flex-direction: column;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      background: #1e293b;
      padding: 6px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn.active { background: #38bdf8; color: #0f172a; }
    
    /* 탭 영역 전체 높이에 맞게 설정 */
    .tab-content { display: none; width: 100%; height: calc(100vh - 65px); }
    .tab-content.active { display: flex; flex-direction: column; }

    header { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
    header h1 { font-size: clamp(1.1rem, 2.2vw, 1.6rem); color: #38bdf8; letter-spacing: 1.5px; }

    .leaderboard-title { text-align: center; font-size: clamp(0.8rem, 1.2vw, 1rem); color: #38bdf8; margin-bottom: 6px; font-weight: bold; flex-shrink: 0; }
    .leaderboard { 
      display: flex; 
      justify-content: center; 
      gap: 10px; 
      margin-bottom: 10px; 
      flex-shrink: 0;
    }
    .rank-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid #334155;
      flex: 1;
      max-width: 280px;
    }
    .rank-card.rank-1 { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
    .rank-card.rank-2 { border-color: #94a3b8; background: rgba(148, 163, 184, 0.1); }
    .rank-card.rank-3 { border-color: #b45309; background: rgba(180, 83, 9, 0.1); }

    .rank-icon { font-size: 1.2rem; }
    .rank-info { display: flex; flex-direction: column; }
    .rank-title { font-size: 0.65rem; color: #94a3b8; font-weight: bold; }
    .rank-name { font-size: clamp(0.8rem, 1.2vw, 1rem); font-weight: bold; color: #ffffff; }
    .rank-dist { font-size: 0.75rem; color: #38bdf8; font-weight: bold; }
    
    /* [핵심] 상단 4개, 하단 3개 전용 컨테이너 및 자동 높이 수축 설정 */
    .grid-container { 
      display: flex; 
      flex-direction: column;
      gap: 10px; 
      width: 100%;
      flex: 1;
      min-height: 0; /* 화면 이탈 방지 */
    }

    .row-top, .row-bottom {
      display: flex;
      gap: 10px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }
    
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #334155;
      transition: all 0.3s ease;
      flex: 1;
      height: 100%;
      box-sizing: border-box;
    }

    .card.inactive { opacity: 0.35; filter: grayscale(100%); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .treadmill-title { font-size: clamp(0.95rem, 1.5vw, 1.2rem); font-weight: bold; }
    .runner-name { color: #38bdf8; font-size: clamp(0.85rem, 1.2vw, 1rem); margin-top: 2px; font-weight: bold; }

    .status-badge { padding: 3px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; background-color: #475569; white-space: nowrap; }
    .card.active .status-badge { background-color: #22c55e; color: #ffffff; }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
    .metric-box { background: #0f172a; padding: 6px; border-radius: 6px; text-align: center; }
    .metric-label { font-size: 0.65rem; color: #94a3b8; margin-bottom: 2px; }
    .metric-value { font-size: clamp(1rem, 1.8vw, 1.3rem); font-weight: 800; }
    .unit { font-size: 0.65rem; font-weight: normal; color: #64748b; }

    .hr-box { background: #0f172a; padding: 6px 8px; border-radius: 8px; text-align: center; border-left: 4px solid #64748b; }
    .hr-value { font-size: clamp(1.2rem, 2.2vw, 1.6rem); font-weight: 900; }

    /* 모바일 뷰 / QR 뷰 전용 레이아웃 */
    #mobile-view, #qr-view { overflow-y: auto; }
    
    .mobile-container {
      width: 100%;
      max-width: 420px;
      margin: 10px auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #38bdf8;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .mobile-container h2 { margin-bottom: 10px; color: #38bdf8; font-size: 1.3rem; }
    .mobile-badge {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 15px;
      font-size: 1rem;
    }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-stop-sim {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .qr-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
      gap: 15px; 
      padding-bottom: 20px;
    }
    .qr-card { background: white; color: black; padding: 15px; border-radius: 12px; text-align: center; }
    .qr-card h3 { margin-bottom: 8px; font-size: 1.1rem; }
    .qr-card p { font-size: 0.75rem; color: #0284c7; margin-top: 8px; word-break: break-all; font-weight: bold; }
    .qr-image { display: flex; justify-content: center; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="tab-bar">
    <button id="btn-tv-view" class="tab-btn active" onclick="switchTab('tv-view')">📺 TV 대시보드</button>
    <button id="btn-mobile-view" class="tab-btn" onclick="switchTab('mobile-view')">📱 모바일 QR 체크인</button>
    <button id="btn-qr-view" class="tab-btn" onclick="switchTab('qr-view')">🖨️ 트레드밀 QR 인쇄기</button>
  </div>

  <!-- [탭 1] TV 대시보드 -->
  <div id="tv-view" class="tab-content active">
    <header>
      <h1>RUNNING ZONE LIVE DASHBOARD</h1>
    </header>

    <div class="leaderboard-title" id="monthlyTitle">👑 명예의 전당 (월간 최장 거리)</div>
    <div class="leaderboard">
      <div class="rank-card rank-1">
        <div class="rank-icon">🥇</div>
        <div class="rank-info"><div class="rank-title">1st PLACE</div><div class="rank-name" id="rank1-name">-</div><div class="rank-dist" id="rank1-dist">0 m</div></div>
      </div>
      <div class="rank-card rank-2">
        <div class="rank-icon">🥈</div>
        <div class="rank-info"><div class="rank-title">2nd PLACE</div><div class="rank-name" id="rank2-name">-</div><div class="rank-dist" id="rank2-dist">0 m</div></div>
      </div>
      <div class="rank-card rank-3">
        <div class="rank-icon">🥉</div>
        <div class="rank-info"><div class="rank-title">3rd PLACE</div><div class="rank-name" id="rank3-name">-</div><div class="rank-dist" id="rank3-dist">0 m</div></div>
      </div>
    </div>

    <div class="grid-container" id="grid"></div>
  </div>

  <!-- [탭 2] 모바일 체크인 -->
  <div id="mobile-view" class="tab-content">
    <div class="mobile-container">
      <h2>RUNNING ZONE CHECK-IN</h2>
      <div class="mobile-badge" id="targetTreadmillBadge">1번 트레드밀</div>
      
      <div id="checkinForm">
        <div class="input-group">
          <label>트레드밀 번호 선택</label>
          <select id="mobileTreadmillSelect" onchange="onSelectTreadmillChange()"></select>
        </div>

        <div class="input-group">
          <label>회원 이름 / 닉네임</label>
          <input type="text" id="mobileNameInput" placeholder="이름을 입력하세요 (예: 홍길동)" />
        </div>

        <button class="btn-submit" onclick="submitCheckin()">운동 시작하기 🔥</button>
      </div>

      <div id="activeRunningForm" style="display: none;">
        <div style="background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 12px;">
          <h3 id="currentRunnerInfo" style="color: #38bdf8; font-size: 1.1rem;">홍길동 님 운동 중 🔥</h3>
          <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 5px;">TV 대시보드에 실시간 연동 중입니다.</p>
        </div>
        <button class="btn-stop-sim" onclick="finishWorkout()">🛑 운동 종료 (기록 저장)</button>
      </div>
    </div>
  </div>

  <!-- [탭 3] QR 코드 생성기 -->
  <div id="qr-view" class="tab-content">
    <div class="qr-grid" id="qrContainer"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "test-1-44912.firebaseapp.com",
      databaseURL: "https://test-1-44912-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "test-1-44912",
      storageBucket: "test-1-44912.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let treadmills = Array.from({ length: 7 }, (_, i) => ({
      id: i + 1, runnerName: '', active: false, speed: '0.0', distance: 0, heartRate: 70
    }));
    let records = [];
    let currentSelectedTreadmillId = 1;

    function getCurrentMonthKey() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${year}-${month}`;
    }

    function updateMonthlyTitle() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const titleEl = document.getElementById('monthlyTitle');
      if (titleEl) {
        titleEl.innerText = `👑 ${month}월 명예의 전당 (월간 최장 거리)`;
      }
    }

    db.ref('treadmills').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        treadmills = data.filter(t => t.id <= 7);
        renderDashboard();
        updateMobileUI();
      } else {
        db.ref('treadmills').set(treadmills);
      }
    });

    function attachMonthlyRecordsListener() {
      const monthKey = getCurrentMonthKey();
      db.ref(`monthly_records/${monthKey}`).on('value', (snapshot) => {
        const data = snapshot.val();
        records = data || [];
        updateLeaderboard();
      });
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      const targetBtn = document.getElementById(`btn-${tabId}`);
      if (targetBtn) targetBtn.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if(tabId === 'qr-view') generateQRCodes();
    }

    function formatDistance(meters) {
      if (meters < 1000) return `${meters} <span class="unit">m</span>`;
      return `${(meters / 1000).toFixed(2)} <span class="unit">km</span>`;
    }

    function handleUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      const treadmillParam = urlParams.get('treadmill');

      if (treadmillParam) {
        const treadmillNum = parseInt(treadmillParam);
        if (treadmillNum >= 1 && treadmillNum <= 7) {
          currentSelectedTreadmillId = treadmillNum;
          switchTab('mobile-view');
        }
      }
    }

    function updateSelectOptions() {
      const selectEl = document.getElementById('mobileTreadmillSelect');
      if (!selectEl) return;

      selectEl.innerHTML = treadmills.map(t => {
        const isSelected = t.id === currentSelectedTreadmillId ? 'selected' : '';
        const status = t.active ? `(이용 중: ${t.runnerName})` : '(이용 가능)';
        return `<option value="${t.id}" ${isSelected}>${t.id}번 트레드밀 ${status}</option>`;
      }).join('');

      document.getElementById('targetTreadmillBadge').innerText = `${currentSelectedTreadmillId}번 트레드밀`;
    }

    function onSelectTreadmillChange() {
      const selectEl = document.getElementById('mobileTreadmillSelect');
      currentSelectedTreadmillId = parseInt(selectEl.value);
      document.getElementById('targetTreadmillBadge').innerText = `${currentSelectedTreadmillId}번 트레드밀`;
      updateMobileUI();
    }

    function updateMobileUI() {
      updateSelectOptions();
      const checkinForm = document.getElementById('checkinForm');
      const activeRunningForm = document.getElementById('activeRunningForm');
      
      const target = treadmills.find(t => t.id === currentSelectedTreadmillId);

      if (target && target.active) {
        checkinForm.style.display = 'none';
        activeRunningForm.style.display = 'block';
        document.getElementById('currentRunnerInfo').innerText = `${target.runnerName} 님 운동 중 🔥`;
      } else {
        checkinForm.style.display = 'block';
        activeRunningForm.style.display = 'none';
      }
    }

    function submitCheckin() {
      const name = document.getElementById('mobileNameInput').value.trim();
      if (!name) { alert('이름을 입력해주세요!'); return; }

      const targetIndex = treadmills.findIndex(t => t.id === currentSelectedTreadmillId);
      if (targetIndex !== -1 && treadmills[targetIndex].active) { 
        alert(`⚠️ ${currentSelectedTreadmillId}번 트레드밀은 현재 이용 중입니다.`); 
        return; 
      }

      if (targetIndex !== -1) {
        treadmills[targetIndex].runnerName = name;
        treadmills[targetIndex].active = true;
        treadmills[targetIndex].speed = (Math.random() * 3 + 7).toFixed(1);
        treadmills[targetIndex].heartRate = Math.floor(Math.random() * 20 + 120);
        treadmills[targetIndex].distance = 0;

        db.ref('treadmills').set(treadmills);
        alert(`${currentSelectedTreadmillId}번 트레드밀에 [${name}] 님 체크인 완료!`);
        document.getElementById('mobileNameInput').value = '';
      }
    }

    function finishWorkout() {
      const targetIndex = treadmills.findIndex(t => t.id === currentSelectedTreadmillId);
      if (targetIndex !== -1 && treadmills[targetIndex].active) {
        saveUserRecord(treadmills[targetIndex].runnerName, treadmills[targetIndex].distance);
        treadmills[targetIndex].active = false; 
        treadmills[targetIndex].runnerName = ''; 
        treadmills[targetIndex].speed = '0.0'; 
        treadmills[targetIndex].distance = 0; 
        treadmills[targetIndex].heartRate = 70;
        
        db.ref('treadmills').set(treadmills);
        alert('운동이 종료되었습니다.');
      }
    }

    function saveUserRecord(runnerName, totalDistance) {
      if (!runnerName || totalDistance <= 0) return;
      const monthKey = getCurrentMonthKey();
      
      let newRecords = [...records];
      const existingIndex = newRecords.findIndex(r => r.name === runnerName);
      
      if (existingIndex !== -1) {
        if (totalDistance > newRecords[existingIndex].distance) {
          newRecords[existingIndex].distance = totalDistance;
        }
      } else {
        newRecords.push({ name: runnerName, distance: totalDistance });
      }
      newRecords.sort((a, b) => b.distance - a.distance);
      
      db.ref(`monthly_records/${monthKey}`).set(newRecords);
    }

    function updateLeaderboard() {
      updateMonthlyTitle();
      for (let i = 1; i <= 3; i++) {
        const nameEl = document.getElementById(`rank${i}-name`);
        const distEl = document.getElementById(`rank${i}-dist`);
        if (records && records[i - 1]) {
          nameEl.innerText = records[i - 1].name;
          distEl.innerHTML = formatDistance(records[i - 1].distance);
        } else {
          nameEl.innerText = '-'; 
          distEl.innerText = '0 m';
        }
      }
    }

    /* [핵심] 상단 4개, 하단 3개 렌더링 로직 적용 */
    function renderCard(t) {
      return `
        <div class="card ${t.active ? 'active' : 'inactive'}">
          <div class="card-header">
            <div>
              <div class="treadmill-title">${t.id}번 트레드밀</div>
              <div class="runner-name">${t.runnerName ? t.runnerName + ' 님' : '대기 중'}</div>
            </div>
            <span class="status-badge">${t.active ? 'RUNNING' : 'WAITING'}</span>
          </div>
          <div class="metrics">
            <div class="metric-box"><div class="metric-label">속도</div><div class="metric-value">${t.speed} <span class="unit">km/h</span></div></div>
            <div class="metric-box"><div class="metric-label">거리</div><div class="metric-value">${formatDistance(t.distance)}</div></div>
          </div>
          <div class="hr-box"><div class="metric-label">실시간 심박수</div><div class="hr-value">${t.active ? t.heartRate : '--'} <span class="unit">BPM</span></div></div>
        </div>
      `;
    }

    function renderDashboard() {
      const gridEl = document.getElementById('grid');
      const top4 = treadmills.slice(0, 4);
      const bottom3 = treadmills.slice(4, 7);

      gridEl.innerHTML = `
        <div class="row-top">
          ${top4.map(t => renderCard(t)).join('')}
        </div>
        <div class="row-bottom">
          ${bottom3.map(t => renderCard(t)).join('')}
        </div>
      `;
    }

    setInterval(() => {
      let activeFound = false;
      treadmills = treadmills.map(t => {
        if (!t.active) return t;
        activeFound = true;
        return { ...t, distance: t.distance + Math.floor(Math.random() * 5 + 3) };
      });
      if (activeFound) { db.ref('treadmills').set(treadmills); }
    }, 1000);

    function generateQRCodes() {
      const container = document.getElementById('qrContainer');
      if (!container) return;
      container.innerHTML = '';

      const cleanBaseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;

      for (let i = 1; i <= 7; i++) {
        const qrUrl = `${cleanBaseUrl}?treadmill=${i}`;
        const card = document.createElement('div');
        card.className = 'qr-card';
        card.innerHTML = `
          <h3>${i}번 트레드밀</h3>
          <div class="qr-image" id="qr-${i}"></div>
          <p>${qrUrl}</p>
        `;
        container.appendChild(card);

        if (typeof QRCode !== 'undefined') {
          new QRCode(document.getElementById(`qr-${i}`), {
            text: qrUrl,
            width: 120, height: 120
          });
        }
      }
    }

    updateMonthlyTitle();
    attachMonthlyRecordsListener();
    handleUrlParams();
  </script>
</body>
</html>
